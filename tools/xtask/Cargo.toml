[package]
name = "fux-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3"
libc = "0.2"
regex = "1.11"
signal-hook = "0.3"
sha2 = "0.10"
toml = "0.9"
time = { version = "0.3", features = ["formatting"] }
vt100 = "=0.16.2"
nix = { version = "0.30", features = ["signal", "process", "socket", "user", "fs", "poll", "term"] }

[workspace]
