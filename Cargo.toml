[workspace]
members = ["fux-vt", "fux-vt/peak", "fuxix", "fuxth"]
exclude = ["fux-vt/fuzz", "fux-vt/gen", "fux-vt/compare", "fuzz", "walk", "diff", "bench"]
resolver = "3"

[package]
name = "fux"
version = "0.36.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small terminal multiplexer: workspaces, tabs and split panes, driven by keys and a CLI"
repository = "https://github.com/gold-silver-copper/fux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "pty", "tmux"]
categories = ["command-line-utilities"]
include = ["/src/**", "/tests/**", "/README.md", "/docs/agents.md", "/docs/json.md", "/LICENSE"]

[features]
# `session::InProcess`, a session asked in-process as the tests ask it, and
# `PaneMut::drain_input` and `wrote_input`, which empty a pane's input as
# if written: for the fuzz targets, fux-diff, fux-bench and fux-vt-compare.
in-process = []

[dependencies]
fux-vt = { path = "fux-vt", version = "0.15.0" }
signal-hook = "0.4"
fuxix = { path = "fuxix", version = "0.8.0" }
fuxth = { path = "fuxth", version = "0.7.0" }

[profile.dev]
debug = 0

# fux-vt's grapheme tables are tested against unicode-segmentation for every
# code point; optimized, that takes seconds rather than half a minute.
[profile.dev.package.unicode-segmentation]
opt-level = 3

# And its widths against unicode-width's, for every code point and many
# clusters.
[profile.dev.package.unicode-width]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints]
workspace = true

# The lints fux, fux-vt and fuxth share, on every target: library,
# binary, examples and tests. What else differs is an attribute in a
# library's lib.rs: `missing_docs` in fux-vt, and `print_stderr` forbidden
# in fux-vt and fuxth (fux keeps it denied: its tests' server log is printed
# with `eprintln!`, which alone the test harness captures). fuxix, where
# fux's `unsafe` lives, keeps its own table: Cargo cannot lift a workspace
# lint for one crate. fux-vt/peak, which uses `unsafe`, keeps its own too.
[workspace.lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"

[workspace.lints.clippy]
suspicious = { level = "forbid", priority = -1 }
print_stdout = "forbid"
print_stderr = "deny"
dbg_macro = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
