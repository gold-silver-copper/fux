[package]
name = "fux"
version = "0.43.5"
edition = "2024"
description = "A terminal multiplexer that is a view over directories: a pane is a directory kept by one small process"
license = "MIT"
repository = "https://github.com/gold-silver-copper/fux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "pty"]
categories = ["command-line-utilities"]
# The referee is a tool beside the package, not part of it.
exclude = ["/tools/referee"]

[profile.release]
panic = "abort"
opt-level = 2
# (Calls from the program into the emulator are inlined again, as they were when the two were one crate.)
lto = "thin"

[dependencies]
fux-vt = { path = "fux-vt", version = "0.20.1" }
fuxix = { path = "fuxix", version = "0.12.0" }

# A program that is not fux and carries it, as koh does: the `main` is the test's own.
[[test]]
name = "carrier"
harness = false

# The emulator and the system calls are crates beside this one. The referee's old emulator is no member.
[workspace]
members = ["fux-vt", "fuxix"]
default-members = [".", "fux-vt", "fuxix"]
exclude = ["tools/referee/old"]

[lints]
workspace = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
