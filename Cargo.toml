[workspace]
members = ["fux-vt"]
exclude = ["fux-vt/fuzz"]
resolver = "3"

[package]
name = "fux"
version = "0.13.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A small terminal multiplexer: workspaces, tabs and split panes, driven by keys and a CLI"
repository = "https://github.com/gold-silver-copper/fux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "pty", "tmux"]
categories = ["command-line-utilities"]
include = ["/src/**", "/tests/**", "/README.md", "/LICENSE"]

[dependencies]
fux-vt = { path = "fux-vt", version = "0.1.1" }
rustix = { version = "1.1", features = ["pty", "termios", "process", "event", "fs", "net", "stdio"] }
signal-hook = "0.3"
unicode-width = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "warn"
