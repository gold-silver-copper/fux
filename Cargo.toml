[package]
name = "fux"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A minimal trusted Bevy terminal multiplexer"

[dependencies]
bevy_app = "=0.19.1"
bevy_ecs = { version = "=0.19.1", features = ["serialize"] }
bevy_reflect = "=0.19.1"
bevy_remote = { version = "=0.19.1", default-features = false, features = ["http", "bevy_asset"] }
bevy_tasks = { version = "=0.19.1", features = ["multi_threaded", "async-io"] }
bevy_time = "=0.19.1"
bevy_log = "=0.19.1"
async-channel = "2"
serde_json = "1"

serde = { version = "1", features = ["derive"] }
bevy_asset = { version = "=0.19.1", features = ["file_watcher"] }
bevy_world_serialization = { version = "=0.19.1", features = ["serialize"] }
bevy_ui = { version = "=0.19.1", features = ["bevy_picking"] }
bevy_input = { version = "=0.19.1", features = ["keyboard", "mouse"] }
bevy_input_focus = { version = "=0.19.1", features = ["keyboard"] }
bevy_picking = { version = "=0.19.1", default-features = false }
bevy_window = "=0.19.1"
bevy_camera = "=0.19.1"
bevy_math = "=0.19.1"
bevy_text = "=0.19.1"
bevy_image = "=0.19.1"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
termina = "=0.3.3"
parking_lot = "0.12"
nix = { version = "0.30", features = ["fs", "signal", "process", "poll"] }
async-io = "2"
ureq = { version = "3", default-features = false, features = ["json"] }
ron = "0.12"
bevy_mesh = "=0.19.1"
base64 = "0.22"
unicode-width = "0.2"
signal-hook = "0.3"
[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
