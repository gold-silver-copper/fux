[package]
name = "fux-vt"
version = "0.12.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Bounded terminal emulation for fux, with input decoding and key, mouse, focus and paste encoders"
repository = "https://github.com/gold-silver-copper/fux"
readme = "README.md"
keywords = ["terminal", "vt100", "ansi", "emulator", "parser"]
categories = ["command-line-interface", "parser-implementations"]
# The external suites the tests read from their own checkouts: not published.
exclude = ["tests/external"]

[features]
# The work counters and the invariant checker (THREATS.md 4.1): for the
# bounds tests, the fuzz targets and mutation runs, never for a release.
checks = []

[dev-dependencies]
# The references the generated tables are tested against: grapheme
# segmentation, and widths (fux-vt's width rule is unicode-width 0.2.2's,
# U+17D8 aside).
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
# The bounds tests' counting allocator (THREATS.md 3.5): live bytes and a
# peak it resets, for each thread apart, its `unsafe` its own.
fux-vt-peak = { path = "peak" }

[[test]]
name = "bounds"
required-features = ["checks"]

[[test]]
name = "seeds"
required-features = ["checks"]

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"
missing_docs = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
wildcard_enum_match_arm = "forbid"
string_slice = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
