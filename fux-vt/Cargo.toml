[package]
name = "fux-vt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Bounded terminal emulation for fux"

[dependencies]
unicode-width = "0.2"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "warn"
