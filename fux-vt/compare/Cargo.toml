[workspace]

[package]
name = "fux-vt-compare"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "fux-vt-compare"
path = "src/main.rs"
doc = false
bench = false

[dependencies]
# The code under test.
fux-vt = { path = ".." }
# The reference: Ghostty's terminal core, built from source by Zig. `run.sh`
# pins the Ghostty commit and the Zig toolchain it is built with.
libghostty-vt = { version = "=0.2.2", default-features = false, optional = true }
# The other engines run in this process.
alacritty_terminal = { version = "=0.26.0", optional = true }
avt = { version = "=0.18.0", optional = true }
vt100 = { version = "=0.16.2", optional = true }
wezterm-term = { git = "https://github.com/wezterm/wezterm", rev = "cab25161054c50fd6c705db4ceefef0f1e5a9575", package = "wezterm-term", optional = true }
# The recorder's PTY and process session, as fux's own.
fuxix = { path = "../../fuxix" }
# The recorder types keys as fux gives them to a pane: decoded as fux reads
# a client's terminal, and encoded in the pane's key mode.
fux = { path = "../..", features = ["in-process"] }
# Reading the engines that run as their own processes.
serde_json = "1"
# Pinned, as fux-vt's own tests pin it: the adapter's width rule for tmux.
unicode-width = "=0.2.2"
# The data limit compare sets on itself (main.rs, `limit_data`), so a
# runaway engine fails an allocation instead of taking the machine.
libc = "0.2"

[features]
default = ["engines"]
# The engines built into this process: Ghostty's core (Zig), libvterm
# (build.rs), alacritty, avt, wezterm and vt100. Without them
# (`--no-default-features`) fux-vt-compare builds with cargo alone, and
# runs what needs no other engine (`esctest` against fux-vt); the others
# say they were not built.
engines = ["dep:libghostty-vt", "dep:alacritty_terminal", "dep:avt", "dep:vt100", "dep:wezterm-term"]

[build-dependencies]
# libvterm, compiled from its release source (run.sh fetches it).
cc = "1"

[profile.release]
# Overflow is an error here, as in a debug build.
overflow-checks = true

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "deny"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
