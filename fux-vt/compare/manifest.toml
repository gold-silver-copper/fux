# Every check fux-vt's evidence needs: what it runs, what it needs, and
# when it runs. `harness.sh` reads it: a command (quick, full, deep, fuzz)
# fails when a check scheduled for it did not run, and when it runs a check
# that is not here. A check with `wired = false` cannot run yet: it is
# listed so that its absence is counted, never forgotten.
#
# A check is:
#
#   name      the name harness.sh gives it (a trailing * matches a family:
#             verdicts-1, verdicts-2, ...); its results are NAME.json and
#             NAME.stamp.json in the harness's output
#   schedule  quick, full or deep (harness.sh; full runs quick's, deep
#             full's and fuzz's), fuzz (harness.sh fuzz), ci (every PR),
#             compare (.github/workflows/compare.yml, on request), nightly
#             (.github/workflows/fuzz.yml), or release
#   command   what runs, from the repository's root
#   needs     what must be installed or fetched for it
#   wired     false while nothing runs it, with `why`
#
# The format is a subset of TOML that harness.sh reads line by line: one
# `key = value` a line, strings in double quotes, arrays on one line.

# --- quick ------------------------------------------------------------------

