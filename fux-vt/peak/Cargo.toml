[package]
name = "fux-vt-peak"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "fux-vt's bounds tests' counting allocator: the live bytes and their peak, per thread"

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
missing_docs = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
undocumented_unsafe_blocks = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
indexing_slicing = "forbid"
arithmetic_side_effects = "forbid"
