[workspace]

[package]
name = "fux-bench"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "fux-bench"
path = "src/main.rs"
doc = false
bench = false

[dependencies]
# The code under test, by path: the working tree's, or REF's in the
# worktree `--against` builds this crate in.
fux = { path = ".." }
fux-vt = { path = "../fux-vt" }
fuxix = { path = "../fuxix" }
# Reads the corpus's manifests, and writes the results.
serde_json = "1"

# fux's own release profile. With other LTO or codegen units, inlining
# differs from fux's build, and the instruction counts with it (PR #78).
[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
