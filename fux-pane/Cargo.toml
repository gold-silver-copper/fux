[package]
name = "fux-pane"
version.workspace = true
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "fux's pane process: a pane's terminal, its input and its program, and what it and its server say to each other"
repository = "https://github.com/gold-silver-copper/fux"

[features]
# What only tests use, fux-server's too: a grid's text, a pane's options,
# a host's program set by hand.
testing = []
# `PaneMut::drain_input` and `wrote_input`, which empty a pane's input as
# if written: for fux-server's `in-process`.
in-process = []

[dependencies]
fux-vt = { path = "../fux-vt", version = "0.17.0" }
fux-wire = { path = "../fux-wire", version = "0.38.0" }
fuxix = { path = "../fuxix", version = "0.10.0" }

# A test reads fux's default history size; the tests name ids by number.
[dev-dependencies]
fux = { path = ".." }
fux-wire = { path = "../fux-wire", features = ["testing"] }

[lints]
workspace = true
