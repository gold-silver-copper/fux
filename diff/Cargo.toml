[workspace]
# The oracle (fux-vt beside a pinned commit, oracle/) and its fuzz target
# (fuzz/) share this lockfile, which says which commit they were built
# against.
members = [".", "oracle", "fuzz"]

[package]
name = "fux-diff"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT"

[[bin]]
name = "fux-diff"
path = "src/main.rs"
doc = false
bench = false

[dependencies]
# The code under test: fux and its crates beside this one.
fux = { path = ".." }
fux-vt = { path = "../fux-vt" }
fuxix = { path = "../fuxix" }
# The baseline it is run beside: the last release of each, as published.
# Bump these after each release.
baseline = { package = "fux", version = "=0.18.1" }
baseline-vt = { package = "fux-vt", version = "=0.3.1" }
baseline-ix = { package = "fuxix", version = "=0.1.6" }

[profile.release]
# Overflow is an error here, as in a debug build.
overflow-checks = true

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_code = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
