[package]
name = "zor"
version = "0.4.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
description = "Agent observation and task coordination over fux, and the OSC 7877 protocol"
repository = "https://github.com/gold-silver-copper/zor"
homepage = "https://github.com/gold-silver-copper/zor"
documentation = "https://docs.rs/zor"
readme = "README.md"

[features]
default = ["cli", "wrap"]
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:libc",
    "dep:local-ipc",
    "dep:nix",
    "dep:portable-pty",
    "dep:regex",
    "dep:serde",
    "dep:serde_json",
    "dep:sha1",
    "dep:sha2",
    "dep:signal-hook",
    "dep:toml",
]
# The PTY wrapper: `zor wrap <command>`. Off by default; needs the `cli` runtime plus a
# terminal emulator for the wrapped child's screen.
wrap = ["cli", "dep:vt100"]

[dependencies]
# Context-rich runtime errors.
anyhow = { version = "1.0", optional = true }
# Command-line parsing for the feature-gated zor binary.
clap = { version = "4.5", features = ["derive"], optional = true }
# Same-user local socket discipline shared with fux: private directories, 0600 sockets,
# kernel peer credentials, instance tokens and non-blocking connect initiation.
local-ipc = { version = "0.2.0", path = "../local-ipc", optional = true }
# Unix terminal and process primitives used only by platform adapters.
libc = { version = "0.2", optional = true }
# Safe termios operations for raw-mode guards.
nix = { version = "0.28", features = ["fs", "poll", "term", "socket", "user", "process", "signal", "time"], optional = true }
# Terminal size type shared with the dashboard and the wrapper.
portable-pty = { version = "=0.9.0", optional = true }
# Compiled screen-rule matchers.
regex = { version = "1.11", optional = true }
# Rule and event serialization.
serde = { version = "1.0", features = ["derive"], optional = true }
# JSON-lines event encoding.
serde_json = { version = "1.0", optional = true }
# Git object integrity for retained source snapshots.
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
# Portable signal registration for the service, watcher and dashboard.
signal-hook = { version = "0.3", optional = true }
# Rule-file decoding.
toml = { version = "0.9", optional = true }
# Terminal emulation of the wrapped child's bytes for rule evaluation (`wrap` feature only).
vt100 = { version = "=0.16.2", optional = true }

[lib]
doctest = false

[dev-dependencies]
tempfile = "3"
# Property testing proves the byte parser is total.
proptest = "1.7"
# JSON contract assertions for the feature-gated event integration tests.
serde_json = "1.0"
# Terminal-emulator tests of the dashboard frame and the joined OSC callback payload contract.
vt100 = "=0.16.2"

[[bin]]
name = "zor"
path = "src/main.rs"
required-features = ["cli"]

[lints.rust]
dead_code = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
