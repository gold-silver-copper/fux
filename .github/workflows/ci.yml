name: CI

# fux is developed on macOS and published for both platforms, and the two
# differ in ways that have hidden real defects (bevy-final findings 010-013),
# so every change runs on both.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # zsh and fish, so the shell marks of every shell fux knows are tested
      # (macOS has zsh; fish is installed there too).
      - name: Shells
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install fish; else sudo apt-get update -q && sudo apt-get install -y -q zsh fish; fi
          # The runner's group-writable function directories would have zsh's
          # completion setup ask whether to trust them, at every start.
          { zsh -c 'autoload -U compaudit; compaudit' 2>/dev/null || true; } | xargs -r sudo chmod g-w,o-w
          echo "FUX_TEST_SHELLS=1" >> "$GITHUB_ENV"

      - name: Platform and pinned toolchain
        run: |
          set -euo pipefail
          CI_LOGS="$RUNNER_TEMP/fux-ci"
          echo "CI_LOGS=$CI_LOGS" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOGS"
          {
            uname -a
            if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; else cat /etc/os-release; fi
            ls -l /bin/sh
            ulimit -n
            rustup show
            rustc -Vv
            cargo -V
          } 2>&1 | tee "$CI_LOGS/platform.log"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Workspace gates (fux and fux-vt)
        run: |
          set -euo pipefail
          # --workspace matters: without it cargo runs only the root package
          # and skips every fux-vt test.
          cargo fmt --all --check 2>&1 | tee "$CI_LOGS/fmt.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/clippy.log"
          # fux-vt's checker, bounds suite and seeds build only with its
          # `checks` feature: linted with it too.
          cargo clippy -p fux-vt --features checks --all-targets --locked -- -D warnings 2>&1 | tee -a "$CI_LOGS/clippy.log"
          cargo test --workspace --locked 2>&1 | tee "$CI_LOGS/test.log"
          # fux-vt's unit tests of its checker (the faults it finds) build
          # only with `checks`: about a minute beside the workspace's.
          cargo test -p fux-vt --features checks --lib --locked 2>&1 | tee -a "$CI_LOGS/test.log"

      # fux-vt's bounds suite and its frozen seeds (the `checks` feature),
      # in release, as debug is too slow for the step's 5 minutes; built in
      # a step of its own, and run under an 8 GiB data limit, so a bound
      # that stops holding fails here instead of taking the runner. A row
      # known to fail is listed in fux-vt/tests/bounds/known-failing.txt,
      # and the suite fails when one starts holding.
      - name: fux-vt bounds and seeds build
        run: |
          set -euo pipefail
          cargo test -p fux-vt --features checks --release --locked --test bounds --test seeds --no-run 2>&1 | tee "$CI_LOGS/bounds-build.log"

      - name: fux-vt bounds and seeds
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # macOS refuses a data limit; the probes' own counts still bound it there.
          if [[ "$RUNNER_OS" == Linux ]]; then ulimit -d $((8 * 1024 * 1024)); fi
          cargo test -p fux-vt --features checks --release --locked --test bounds --test seeds 2>&1 | tee "$CI_LOGS/bounds.log"

      - name: fux-vt wraptest (DEC STD 070 D.6.1)
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test -p fux-vt --locked --test wraptest 2>&1 | tee "$CI_LOGS/wraptest.log"

      - name: fux-vt xterm.js fixtures
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test -p fux-vt --locked --test xtermjs 2>&1 | tee "$CI_LOGS/xtermjs.log"

      - name: fux-vt UTF-8 property
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test -p fux-vt --locked --test utf8_property 2>&1 | tee "$CI_LOGS/utf8-property.log"

      # Ghostty's and vt100-rust's fuzz corpora (vendored, MIT) replayed
      # under the invariant checker; mosh's (GPL) is an ignored test.
      - name: fux-vt external corpora
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then ulimit -d $((8 * 1024 * 1024)); fi
          cargo test -p fux-vt --features checks --release --locked --test external_corpora 2>&1 | tee "$CI_LOGS/external-corpora.log"

      - name: libvterm's tests, translated
        timeout-minutes: 5
        run: cargo test -p fux-vt --locked --test libvterm

      - name: Minimum Rust version
        # Every manifest says rust-version = "1.95"; the pinned toolchain is
        # newer, so nothing else would notice a newer feature creeping in.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --workspace --all-targets --locked 2>&1 | tee "$CI_LOGS/msrv.log"

      - name: Excluded packages
        # walk, the fuzz targets and fux-bench use fux and fux-vt by path,
        # so an API change that breaks them breaks nothing in the workspace.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for package in walk fuzz fux-vt/fuzz fux-vt/gen bench; do
            cargo fmt --manifest-path "$package/Cargo.toml" --all --check
            cargo clippy --manifest-path "$package/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "$package/Cargo.toml" --locked
          done 2>&1 | tee "$CI_LOGS/excluded.log"

      - name: fux-vt/compare type-checks
        # Its own workflow (compare.yml) builds Ghostty with Zig and runs on
        # request only, so an API change could break it unnoticed. DOCS_RS
        # skips both native builds, Ghostty's and libvterm's; clippy links
        # nothing, so it needs neither.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo fmt --manifest-path fux-vt/compare/Cargo.toml --all --check
          DOCS_RS=1 cargo clippy --manifest-path fux-vt/compare/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/compare.log"
          cargo clippy --manifest-path fux-vt/compare/Cargo.toml --all-targets --locked --no-default-features -- -D warnings 2>&1 | tee -a "$CI_LOGS/compare.log"

      - name: esctest against fux-vt
        # fux-vt-compare built without the engines it links (Ghostty's
        # core needs Zig): esctest2, at the commit references/fetch.sh pins,
        # against fux-vt alone. A test failing that esctest-expected.txt
        # does not list fails, and so does one listed that passes.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^esctest_commit=//p' references/fetch.sh)
          git init -q references/xterm/esctest2
          git -C references/xterm/esctest2 fetch -q --depth 1 https://github.com/ThomasDickey/esctest2 "$commit"
          git -C references/xterm/esctest2 -c advice.detachedHead=false checkout -q FETCH_HEAD
          cargo run --release --locked --quiet --no-default-features --manifest-path fux-vt/compare/Cargo.toml -- esctest 2>&1 | tee "$CI_LOGS/esctest.log"

      - name: fux-vt oracle builds
        # Against this very commit, so both sides share one API and it
        # builds with no shims (diff/README.md). The pin stays for the step
        # below.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          diff/oracle.sh --pin HEAD
          cargo clippy --manifest-path diff/Cargo.toml -p fux-vt-oracle -p fux-vt-oracle-fuzz --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/oracle.log"
          # The families it shares with fux-vt-compare check their own
          # citations wherever they are built (families.rs, `fux_vt_dir`).
          cargo test --manifest-path diff/Cargo.toml -p fux-vt-oracle --locked families:: 2>&1 | tee -a "$CI_LOGS/oracle.log"

      - name: fux-diff builds
        # It builds the last release beside this code, so a deliberate API
        # change breaks it until its baseline is bumped (diff/README.md):
        # then the bump is part of that change.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo fmt --manifest-path diff/Cargo.toml --all --check
          cargo clippy --manifest-path diff/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/diff.log"

      - name: Socket cleanup where inode numbers are reused
        # Only a filesystem that gives a freed inode number to the next file
        # tests the guarantee (bevy-final finding 014); the runner's home,
        # where tests make their files (fuxix::file::scratch), is ext4,
        # which does. The test says which it found.
        run: |
          set -euo pipefail
          df -T "${TMPDIR:-$HOME}" 2>/dev/null || df "${TMPDIR:-$HOME}"
          cargo test --locked --lib socket::tests::cleanup_leaves_a_socket_that_replaced_ours_where_inodes_are_reused -- --exact --nocapture

      - name: Packaging
        # fux depends on the fux-vt beside it, so the two are packaged
        # together: `-p fux` alone fails whenever fux needs a fux-vt that is
        # not yet on crates.io.
        run: |
          set -euo pipefail
          cargo publish --dry-run --workspace --locked 2>&1 | tee "$CI_LOGS/package.log"

      - name: Whitespace in the committed range
        if: runner.os == 'Linux'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$HEAD"
          # A force-push leaves `before` pointing at a rewritten commit that is
          # no longer fetchable; fall back to checking the whole head tree.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BASE"; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE" "$HEAD"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/fux-ci/
          retention-days: 7
          if-no-files-found: ignore

  # The agent benchmark's scripted tier for fux: every task, once, with fux
  # and python3 alone (no tmux, zellij, herdr or claude). A task fux used to
  # pass and fails now is a regression in how scripts and agents drive it.
  agentbench:
    name: agentbench (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: agentbench
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Scripted tier, fux, every task once
        run: |
          set -euo pipefail
          python3 -I agentbench/guide_check.py
          cargo build --release --locked
          python3 -I agentbench/run.py --tools fux --repeats 1 --workers 4 --skip-expensive \
            --strict --fux-bin "$GITHUB_WORKSPACE/target/release/fux" \
            --out "$RUNNER_TEMP/agentbench.json"

  # koh's client driven in a fux pane against a loopback `koh serve`
  # (tests/koh.rs): a remote pager, prompt, slow command and REPL answer as
  # local ones do. koh is built at a pinned commit, bumped by hand when koh
  # changes what it relays; outside this checkout, as fux's workspace would
  # claim it, into fux's target directory, so its dependencies are cached.
  koh:
    name: koh scenario (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KOH_COMMIT: 29946027b9d7125f9b18c14ea5b1a38dd6a0df61
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: koh
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Build koh
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/koh"
          git -C "$RUNNER_TEMP/koh" fetch -q --depth=1 https://github.com/gold-silver-copper/koh "$KOH_COMMIT"
          git -C "$RUNNER_TEMP/koh" checkout -q FETCH_HEAD
          # From here, with fux's pinned toolchain.
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/koh" \
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/koh/Cargo.toml"

      - name: koh in a fux pane
        run: |
          set -euo pipefail
          FUX_KOH="$GITHUB_WORKSPACE/target/koh/release/koh" \
            cargo test --locked --test koh -- --ignored --nocapture
