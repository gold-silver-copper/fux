name: CI

# fux is developed on macOS and published for both platforms, and the two
# differ in ways that have hidden real defects (bevy-final findings 010-013),
# so every change runs on both.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Platform and pinned toolchain
        run: |
          set -euo pipefail
          CI_LOGS="$RUNNER_TEMP/fux-ci"
          echo "CI_LOGS=$CI_LOGS" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOGS"
          {
            uname -a
            if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; else cat /etc/os-release; fi
            ls -l /bin/sh
            ulimit -n
            rustup show
            rustc -Vv
            cargo -V
          } 2>&1 | tee "$CI_LOGS/platform.log"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Workspace gates (fux and fux-vt)
        run: |
          set -euo pipefail
          # --workspace matters: without it cargo runs only the root package
          # and skips every fux-vt test.
          cargo fmt --all --check 2>&1 | tee "$CI_LOGS/fmt.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/clippy.log"
          cargo test --workspace --locked 2>&1 | tee "$CI_LOGS/test.log"

      - name: Packaging
        # fux depends on the fux-vt beside it, so the two are packaged
        # together: `-p fux` alone fails whenever fux needs a fux-vt that is
        # not yet on crates.io.
        run: |
          set -euo pipefail
          cargo publish --dry-run --workspace --locked 2>&1 | tee "$CI_LOGS/package.log"

      - name: Whitespace in the committed range
        if: runner.os == 'Linux'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$HEAD"
          # A force-push leaves `before` pointing at a rewritten commit that is
          # no longer fetchable; fall back to checking the whole head tree.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BASE"; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE" "$HEAD"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/fux-ci/
          retention-days: 7
          if-no-files-found: ignore
