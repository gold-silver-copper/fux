name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integrations:
        description: Verify optional koh and zor process integrations
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.95.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} test --locked -- --test-threads=1
      - run: cargo +${{ matrix.rust }} doc --no-deps --locked
      - name: Build the exact binary for real-process scenarios
        run: cargo +${{ matrix.rust }} build --locked --bin fux
      - run: cargo +${{ matrix.rust }} clippy --manifest-path tests/verify/fixture-child/Cargo.toml --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} test --manifest-path tests/verify/fixture-child/Cargo.toml --locked

  android-cross-check:
    name: Android aarch64 cross-check (not runtime coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup target add aarch64-linux-android
      - name: Select Android NDK compiler
        run: |
          test -x "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android --locked

  cross-repository:
    name: Optional koh and zor integrations
    if: github.event_name == 'workflow_dispatch' && inputs.integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: 50a8270f48175c4a23e84c0ece008ff9ae49d918
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: fb6a1ef18c043ecf9dc94a10a18719e820bee685
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - name: Build zor and expose its exact path to tests
        run: |
          cargo build --manifest-path zor/Cargo.toml --locked
          echo "ZOR_BIN=$GITHUB_WORKSPACE/zor/target/debug/zor" >> "$GITHUB_ENV"
          echo "FUX_REQUIRE_ZOR_BIN=1" >> "$GITHUB_ENV"
      - run: cargo build --locked --bin fux
      - run: cargo test --test zor_integration --locked
      - name: Verify koh gateway against the exact fux binary
        env:
          FUX_BIN: ${{ github.workspace }}/target/debug/fux
          KOH_REQUIRE_FUX_BIN: "1"
        run: cargo test --manifest-path references/koh/Cargo.toml --test gateway --locked
      - name: Verify gateway reconnect with the exact fux binary
        env:
          FUX_BIN: ${{ github.workspace }}/target/debug/fux
          KOH_REQUIRE_FUX_BIN: "1"
        run: |
          cargo test --manifest-path references/koh/Cargo.toml --lib gateway:: --locked
      - run: cargo test --manifest-path zor/Cargo.toml --all-features --locked
      - run: cargo check --manifest-path zor/Cargo.toml --no-default-features --all-targets --locked

  package:
    name: Standalone package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo package --locked
