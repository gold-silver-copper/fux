name: CI

# fux is developed on macOS and published for both platforms, and the two
# differ in ways that have hidden real defects (bevy-final findings 010-013),
# so every change runs on both, and on Windows 11 too (WINDOWS.md, D-130).

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # zsh and fish, so the shell marks the README shows for each are
      # tested (macOS has zsh; fish is installed there too).
      - name: Shells
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then brew install fish; else sudo apt-get update -q && sudo apt-get install -y -q zsh fish; fi
          # The runner's group-writable function directories would have zsh's
          # completion setup ask whether to trust them, at every start.
          { zsh -c 'autoload -U compaudit; compaudit' 2>/dev/null || true; } | xargs -r sudo chmod g-w,o-w
          echo "FUX_TEST_SHELLS=1" >> "$GITHUB_ENV"

      - name: Platform and pinned toolchain
        run: |
          set -euo pipefail
          CI_LOGS="$RUNNER_TEMP/fux-ci"
          echo "CI_LOGS=$CI_LOGS" >> "$GITHUB_ENV"
          mkdir -p "$CI_LOGS"
          {
            uname -a
            if [[ "$RUNNER_OS" == macOS ]]; then sw_vers; else cat /etc/os-release; fi
            ls -l /bin/sh
            ulimit -n
            rustup show
            rustc -Vv
            cargo -V
          } 2>&1 | tee "$CI_LOGS/platform.log"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: verify-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Workspace gates (fux and fux-vt)
        run: |
          set -euo pipefail
          # --workspace matters: without it cargo runs only the root package
          # and skips every fux-vt test.
          cargo fmt --all --check 2>&1 | tee "$CI_LOGS/fmt.log"
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/clippy.log"
          # fux-vt's checker, bounds suite and seeds build only with its
          # `checks` feature: linted with it too.
          cargo clippy -p fux-vt --features checks --all-targets --locked -- -D warnings 2>&1 | tee -a "$CI_LOGS/clippy.log"
          cargo test --workspace --locked 2>&1 | tee "$CI_LOGS/test.log"
          # fux-vt's unit tests of its checker (the faults it finds) build
          # only with `checks`: about a minute beside the workspace's.
          cargo test -p fux-vt --features checks --lib --locked 2>&1 | tee -a "$CI_LOGS/test.log"
          # Render allocation refusals, without enabling the large VT suites
          # in the ordinary workspace test run.
          cargo clippy -p fux-server --features checks --all-targets --locked -- -D warnings 2>&1 | tee -a "$CI_LOGS/clippy.log"
          cargo test -p fux-server --features checks --lib refused_ --locked 2>&1 | tee -a "$CI_LOGS/test.log"
          # The client refused memory as it joins a reply.
          cargo clippy -p fux --features checks --all-targets --locked -- -D warnings 2>&1 | tee -a "$CI_LOGS/clippy.log"
          cargo test -p fux --features checks --lib refused_ --locked 2>&1 | tee -a "$CI_LOGS/test.log"

      # fux-vt's bounds suite and its frozen seeds (the `checks` feature),
      # in release, as debug is too slow for the step's 5 minutes; built in
      # a step of its own, and run under an 8 GiB data limit, so a bound
      # that stops holding fails here instead of taking the runner.
      # fuxix's PTY stress tests open thousands of PTYs on every core: ignored
      # in plain `cargo test`, run here.
      - name: fuxix PTY stress
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cargo test -p fuxix --locked -- --ignored 2>&1 | tee "$CI_LOGS/pty-stress.log"

      - name: fux-vt bounds and seeds build
        run: |
          set -euo pipefail
          cargo test -p fux-vt --features checks --release --locked --test bounds --test seeds --no-run 2>&1 | tee "$CI_LOGS/bounds-build.log"

      - name: fux-vt bounds and seeds
        # bounds.rs alone takes 200-250 s on macOS runners (master b65347072:
        # 247 s), so 5 minutes left no room for a slow runner.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # macOS refuses a data limit; the probes' own counts still bound it there.
          if [[ "$RUNNER_OS" == Linux ]]; then ulimit -d $((8 * 1024 * 1024)); fi
          cargo test -p fux-vt --features checks --release --locked --test bounds --test seeds 2>&1 | tee "$CI_LOGS/bounds.log"

      # The boundary tests (fux-vt/tests/guards.rs) with `checks`, in
      # release beside the bounds suite, the one that makes 64 Mi cells
      # (about 1.5 GiB, so ignored elsewhere) included.
      - name: fux-vt guard tests, the 1.5 GiB one included
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test -p fux-vt --features checks --release --locked --test guards -- --include-ignored 2>&1 | tee "$CI_LOGS/guards.log"

      # Ghostty's and vt100-rust's fuzz corpora (vendored, MIT) replayed
      # under the invariant checker; mosh's (GPL) is an ignored test.
      - name: fux-vt external corpora
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then ulimit -d $((8 * 1024 * 1024)); fi
          cargo test -p fux-vt --features checks --release --locked --test external_corpora 2>&1 | tee "$CI_LOGS/external-corpora.log"

      - name: fux-vt builds for wasm32 (the browser)
        # fux-vt has no OS dependency, so it builds for a 32-bit target with
        # no OS at all; this keeps it that way. grift's own CI keeps grift so.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo check -p fux-vt -p fux-vt-peak --target wasm32-unknown-unknown --locked 2>&1 | tee "$CI_LOGS/wasm.log"

      - name: Minimum Rust version
        # Every manifest says rust-version = "1.95"; the pinned toolchain is
        # newer, so nothing else would notice a newer feature creeping in.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          rustup toolchain install 1.95 --profile minimal
          cargo +1.95 check --workspace --all-targets --locked 2>&1 | tee "$CI_LOGS/msrv.log"

      - name: Excluded packages
        # walk, the fuzz targets and fux-bench use fux and fux-vt by path,
        # so an API change that breaks them breaks nothing in the workspace.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for package in walk fuzz fux-vt/fuzz fux-vt/gen bench; do
            cargo fmt --manifest-path "$package/Cargo.toml" --all --check
            cargo clippy --manifest-path "$package/Cargo.toml" --all-targets --locked -- -D warnings
            cargo test --manifest-path "$package/Cargo.toml" --locked
          done 2>&1 | tee "$CI_LOGS/excluded.log"

      - name: fux-vt/compare type-checks
        # Its own workflow (compare.yml) builds Ghostty with Zig and runs on
        # request only, so an API change could break it unnoticed. DOCS_RS
        # skips both native builds, Ghostty's and libvterm's; clippy links
        # nothing, so it needs neither.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo fmt --manifest-path fux-vt/compare/Cargo.toml --all --check
          DOCS_RS=1 cargo clippy --manifest-path fux-vt/compare/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/compare.log"
          cargo clippy --manifest-path fux-vt/compare/Cargo.toml --all-targets --locked --no-default-features -- -D warnings 2>&1 | tee -a "$CI_LOGS/compare.log"

      # esctest2 at the commit references/fetch.sh pins, fetched once and
      # cached by that commit.
      - name: esctest2's pinned commit
        id: esctest2
        if: runner.os == 'Linux'
        run: echo "commit=$(sed -n 's/^esctest_commit=//p' references/fetch.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.os == 'Linux'
        with:
          path: references/xterm/esctest2
          key: esctest2-${{ steps.esctest2.outputs.commit }}

      - name: esctest against fux-vt
        # fux-vt-compare built without the engines it links (Ghostty's
        # core needs Zig): esctest2 against fux-vt alone. A test failing
        # that esctest-expected.txt does not list fails, and so does one
        # listed that passes.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          COMMIT: ${{ steps.esctest2.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! -d references/xterm/esctest2/.git ]]; then
            git init -q references/xterm/esctest2
            git -C references/xterm/esctest2 fetch -q --depth 1 https://github.com/ThomasDickey/esctest2 "$COMMIT"
            git -C references/xterm/esctest2 -c advice.detachedHead=false checkout -q FETCH_HEAD
          fi
          cargo run --release --locked --quiet --no-default-features --manifest-path fux-vt/compare/Cargo.toml -- esctest 2>&1 | tee "$CI_LOGS/esctest.log"

      - name: fux-vt oracle builds
        # Against this very commit, so both sides share one API and it
        # builds with no shims (diff/README.md). The pin stays for the step
        # below.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          diff/oracle.sh --pin HEAD
          cargo clippy --manifest-path diff/Cargo.toml -p fux-vt-oracle -p fux-vt-oracle-fuzz --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/oracle.log"
          # The families it shares with fux-vt-compare check their own
          # citations wherever they are built (families.rs, `fux_vt_dir`).
          cargo test --manifest-path diff/Cargo.toml -p fux-vt-oracle --locked families:: 2>&1 | tee -a "$CI_LOGS/oracle.log"

      - name: fux-diff builds
        # It builds the last release beside this code, so a deliberate API
        # change breaks it until its baseline is bumped (diff/README.md):
        # then the bump is part of that change.
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo fmt --manifest-path diff/Cargo.toml --all --check
          cargo clippy --manifest-path diff/Cargo.toml --all-targets --locked -- -D warnings 2>&1 | tee "$CI_LOGS/diff.log"

      - name: Socket cleanup where inode numbers are reused
        # Only a filesystem that gives a freed inode number to the next file
        # tests the guarantee (bevy-final finding 014); the runner's home,
        # where tests make their files (fuxix::file::scratch), is ext4,
        # which does. The test says which it found.
        run: |
          set -euo pipefail
          df -T "${TMPDIR:-$HOME}" 2>/dev/null || df "${TMPDIR:-$HOME}"
          cargo test -p fux-server --locked --lib socket::endpoint::tests::cleanup_leaves_a_socket_that_replaced_ours_where_inodes_are_reused -- --exact --nocapture

      - name: Packaging
        # fux depends on the fux-vt beside it, so the two are packaged
        # together: `-p fux` alone fails whenever fux needs a fux-vt that is
        # not yet on crates.io.
        run: |
          set -euo pipefail
          cargo publish --dry-run --workspace --locked 2>&1 | tee "$CI_LOGS/package.log"

      - name: Whitespace in the committed range
        if: runner.os == 'Linux'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          if [[ "$EVENT" != pull_request && "$EVENT" != push ]]; then
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$HEAD"
          # A force-push leaves `before` pointing at a rewritten commit that is
          # no longer fetchable; fall back to checking the whole head tree.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BASE"; then
            BASE=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE" "$HEAD"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/fux-ci/
          retention-days: 7
          if-no-files-found: ignore

  # fux on Windows 11 25H2 (arm64) and Server 2025 (x64, Windows 11 24H2's
  # code base): every crate, the server and the client, in a console a test
  # hosts and in real Windows Terminal on the runner's desktop (WINDOWS.md).
  windows:
    name: windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The arm64 image has no rustup; rust-toolchain.toml picks the
      # toolchain either way.
      - name: Platform and pinned toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
            & "$env:RUNNER_TEMP\rustup-init.exe" -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
          "$($cv.ProductName) $($cv.DisplayVersion) build $($cv.CurrentBuild).$($cv.UBR) $env:PROCESSOR_ARCHITECTURE"
          rustup show active-toolchain
          rustc -Vv

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ matrix.os }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      # The pinned ConPTY package (WINDOWS.md, PR 6), downloaded once and
      # cached, hash-checked here: fuxix's ConPTY tests read it from
      # FUXIX_CONPTY_PACKAGE, so no test touches the network. The tests
      # (fuxix/tests/conpty.rs and conpty_fallback.rs) run in their own
      # step below, and log S1's byte-exactness and S4's probes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conpty
          key: conpty-1.25.260930003
      - name: ConPTY package
        timeout-minutes: 3
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/conpty/conpty.nupkg"
          mkdir -p "$(dirname "$package")"
          if [ ! -f "$package" ]; then
            curl --fail --silent --show-error --location --proto =https \
              --retry 5 --retry-all-errors --max-time 120 -o "$package" \
              https://api.nuget.org/v3-flatcontainer/microsoft.windows.console.conpty/1.25.260930003/microsoft.windows.console.conpty.1.25.260930003.nupkg
          fi
          echo "02b07b349af66d801159bdf9e440d4a1ce78bb951f37fc8609731665afdae7ee  $package" | sha256sum --check
          echo "FUXIX_CONPTY_PACKAGE=$package" >> "$GITHUB_ENV"

      - name: fux-vt, fuxix, fux-wire, fux-server and fux
        run: |
          set -euo pipefail
          packages=(-p fux-vt -p fux-vt-peak -p fuxix -p fux-wire)
          cargo clippy "${packages[@]}" -p fux-server -p fux --all-targets --locked -- -D warnings
          cargo clippy -p fux-vt --features checks --all-targets --locked -- -D warnings
          cargo test "${packages[@]}" --locked -- --skip another_user_is_refused

      # One polling thread per process (WINDOWS.md, PR 4): these poll, so
      # they take turns.
      - name: fux-server and fux units
        if: ${{ !cancelled() }}
        timeout-minutes: 7
        run: |
          set -euo pipefail
          cargo test -p fux-server -p fux --lib --bins --locked -- --test-threads 1

      # fux's server (WINDOWS.md, PR 7), real fux driven over its pipe by
      # a small wire client, with what each found in the log: a server
      # killed outright and a new one driving its live panes (S3's
      # probe), and D-136's signals. The ConPTY is CI's cached package.
      - name: fux's server
        timeout-minutes: 6
        run: |
          set -euo pipefail
          cargo test -p fux --test windows --locked -- --nocapture --test-threads 1
          tasklist //FO CSV | grep -iE "fux|openconsole|cmd.exe|ping" || true

      # fux's client (WINDOWS.md, PR 8), real `fux` attached in a console a
      # test hosts (tests/console.rs), through cmd.exe as in a terminal.
      - name: fux client
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set +e
          cargo test -p fuxix --test console --locked -- --nocapture; console=$?
          cargo test -p fux --test console --locked -- --nocapture; client=$?
          tasklist //FO CSV | grep -iE "fux|openconsole|cmd.exe" || true
          exit $((console + client))

      # The same tests as a standard user: no elevation, so fux's own
      # folder, and no administrator's rights over the runner's files. The
      # user is made here, with a masked password only this step sees.
      - name: fux client, as a standard user
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        shell: pwsh
        run: |
          $pw = 'Fx!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          "::add-mask::$pw"
          net user fuxclient $pw /add | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Service seclogon -StartupType Manual
          Start-Service seclogon
          icacls $PWD /grant '*S-1-5-32-545:(OI)(CI)M' /Q | Out-Null
          icacls (Split-Path $env:FUXIX_CONPTY_PACKAGE) /grant '*S-1-5-32-545:(OI)(CI)RX' /Q | Out-Null
          [Environment]::SetEnvironmentVariable('FUXIX_CONPTY_PACKAGE', $env:FUXIX_CONPTY_PACKAGE, 'Machine')
          $secret = ConvertTo-SecureString $pw -AsPlainText -Force
          $user = New-Object System.Management.Automation.PSCredential('fuxclient', $secret)
          $failed = 0
          foreach ($exe in Get-ChildItem target\debug\deps\console-*.exe) {
            "=== $($exe.Name)"
            $log = "$env:RUNNER_TEMP\console.txt"
            $run = Start-Process -FilePath $exe.FullName -Credential $user -WorkingDirectory $PWD `
              -RedirectStandardError $log -RedirectStandardOutput "$log.out" -PassThru -Wait
            Get-Content $log
            "exit $($run.ExitCode)"
            $failed += [int]($run.ExitCode -ne 0)
          }
          exit $failed

      # The event loop's probes (WINDOWS.md, PR 4), with what each measured
      # in the log: a flood both ways with signals, no lost wake-up, an idle
      # loop's CPU, a 1 ms timeout's lateness, a child's exit as Chld.
      - name: fuxix event loop probes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cargo test -p fuxix --test windows --locked -- --nocapture

      # ConPTY and Job (WINDOWS.md, PR 6), with what each found in the log:
      # S1's bytes exact through the fetched ConPTY, Ctrl-C and Ctrl-Break,
      # the hang-up, the three kills, and the built-in used only when
      # `load` said why. Then tasklist logs any console process still
      # running (only logged: an OpenConsole of the last test may still be
      # exiting).
      - name: fuxix ConPTY
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: |
          set -euo pipefail
          cargo test -p fuxix --test conpty --test conpty_fallback --locked -- --nocapture
          tasklist //FO CSV | grep -iE "conpty|openconsole|conhost|cmd.exe" || true

      # Named pipes (WINDOWS.md, PR 5), with what each found in the log:
      # the same user both ways, a name taken first, a child taking its
      # client on a spare, a child given a connected instance, and a
      # standard second user refused. That user is
      # made here, with a masked password only this step sees.
      - name: fuxix named pipes
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $pw = 'Fx!' + [guid]::NewGuid().ToString('N').Substring(0, 10)
          "::add-mask::$pw"
          # 13 characters: from 15 on, net user asks a question no one answers.
          net user fuxixother $pw /add | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Service seclogon -StartupType Manual
          Start-Service seclogon
          $dir = 'C:\fuxix-other'
          New-Item -ItemType Directory -Force $dir | Out-Null
          icacls $dir /grant '*S-1-5-32-545:(OI)(CI)M' | Out-Null
          $env:FUXIX_OTHER_USER = 'fuxixother'
          $env:FUXIX_OTHER_PASSWORD = $pw
          $env:FUXIX_OTHER_DIR = $dir
          cargo test -p fuxix --test pipes --locked -- --nocapture --test-threads 1
          exit $LASTEXITCODE

      # Real fux in real Windows Terminal, on the runner's desktop, with
      # Defender's real-time protection on, fetching the ConPTY itself and
      # typed at through the keyboard: CI's nearest to a person. Its
      # screenshots are kept. What it can't show: WINDOWS.md, "Not verified
      # yet". Last: Defender on and a timing probe don't mix.
      - name: fux in Windows Terminal
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $false
          foreach ($i in 1..30) {
            if ((Get-MpComputerStatus).RealTimeProtectionEnabled) { break }
            Start-Sleep 1
          }
          "real-time protection: $((Get-MpComputerStatus).RealTimeProtectionEnabled)"
          if (-not (Get-MpComputerStatus).RealTimeProtectionEnabled) { throw 'real-time protection is off' }
          $version = '1.25.2733.0'
          $arch, $hash = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') {
            'arm64', '11b4fe264ecaa71b08cd84195536f68c669808155338e9f47f4da668b4cf0e26'
          } else {
            'x64', 'bf3ef2012f6c44d8340a4c58125acc9498d19b580f9890dc043cdf831852e796'
          }
          $zip = "$env:RUNNER_TEMP\wt.zip"
          curl.exe -fsSL --retry 5 -o $zip "https://github.com/microsoft/terminal/releases/download/v$version/Microsoft.WindowsTerminal_${version}_$arch.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $hash) { throw 'Windows Terminal hash' }
          Expand-Archive $zip "$env:RUNNER_TEMP\wt"
          $terminal = Get-ChildItem "$env:RUNNER_TEMP\wt" -Recurse -Filter WindowsTerminal.exe | Select-Object -First 1
          New-Item -ItemType File (Join-Path $terminal.DirectoryName '.portable') -Force | Out-Null
          # A copy: a runner's tests may still hold the build's own.
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\run" | Out-Null
          Copy-Item target\debug\fux.exe "$env:RUNNER_TEMP\run\fux.exe"
          ./tests/windows-terminal.ps1 -Fux "$env:RUNNER_TEMP\run\fux.exe" -Terminal $terminal.FullName -Out "$env:RUNNER_TEMP\terminal"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: windows-terminal-${{ matrix.os }}
          path: ${{ runner.temp }}/terminal/*.png
          if-no-files-found: warn

  # The agent benchmark's scripted tier for fux: every task, once, with fux
  # and python3 alone (no tmux, zellij, herdr or claude). A task fux used to
  # pass and fails now is a regression in how scripts and agents drive it.
  agentbench:
    name: agentbench (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: agentbench
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - name: Scripted tier, fux, every task once
        run: |
          set -euo pipefail
          python3 -I -m unittest discover -s agentbench -p 'test_*.py'
          cargo build --release --locked
          python3 -I agentbench/guide_check.py --fux-bin "$GITHUB_WORKSPACE/target/release/fux"
          python3 -I agentbench/run.py --tools fux --repeats 1 --workers 4 --skip-expensive \
            --strict --fux-bin "$GITHUB_WORKSPACE/target/release/fux" \
            --out "$RUNNER_TEMP/agentbench.json"
