name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.91.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: d6ded15bca6fb807b4896f49c8a43dfcdf43ee27
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: 25cbc462ee3cf91034fa6763279662f0e2eaabc7
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} test --all-features --locked -- --test-threads=1
      - run: cargo +${{ matrix.rust }} doc --no-deps --all-features --locked
      - name: Build exact binaries for the binary verification corpus
        run: |
          cargo +${{ matrix.rust }} build --locked --bin fux
          cargo +${{ matrix.rust }} build --manifest-path zor/Cargo.toml --locked --bin zor
      - run: cargo +${{ matrix.rust }} clippy --manifest-path tests/verify/fixture-child/Cargo.toml --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} test --manifest-path tests/verify/fixture-child/Cargo.toml --locked

  verification-layers:
    name: Verification layers / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: d6ded15bca6fb807b4896f49c8a43dfcdf43ee27
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: 25cbc462ee3cf91034fa6763279662f0e2eaabc7
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - run: cargo test --test verification_corpus --test verification_structure --test verification_loom --locked
      - run: cargo build --locked --bin fux
      - run: cargo build --manifest-path zor/Cargo.toml --locked --bin zor
      - run: cargo test --manifest-path tests/verify/fixture-child/Cargo.toml --locked
      - run: cargo check --manifest-path zor/Cargo.toml --no-default-features --all-targets --locked

  android-cross-check:
    name: Android aarch64 cross-check (not runtime coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: d6ded15bca6fb807b4896f49c8a43dfcdf43ee27
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: 25cbc462ee3cf91034fa6763279662f0e2eaabc7
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - run: rustup target add aarch64-linux-android
      - name: Select Android NDK compiler
        run: |
          test -x "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android --locked

  cross-repository:
    name: zor integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: d6ded15bca6fb807b4896f49c8a43dfcdf43ee27
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: 25cbc462ee3cf91034fa6763279662f0e2eaabc7
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - name: Build zor and expose its exact path to tests
        run: |
          cargo build --manifest-path zor/Cargo.toml --locked
          echo "ZOR_BIN=$GITHUB_WORKSPACE/zor/target/debug/zor" >> "$GITHUB_ENV"
          echo "FUX_REQUIRE_ZOR_BIN=1" >> "$GITHUB_ENV"
      - run: cargo test --all-features --locked -- --test-threads=1

  package:
    name: Package (requires koh 0.12.1 and zor 0.1.2 on crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: d6ded15bca6fb807b4896f49c8a43dfcdf43ee27
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: 25cbc462ee3cf91034fa6763279662f0e2eaabc7
      - name: Assemble reviewed dependency sources
        run: python3 tools/dependencies.py apply
      - run: cargo package --locked
