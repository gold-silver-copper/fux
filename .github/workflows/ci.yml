name: ci
on:
  push:
    branches: [master, next]
  pull_request:
    branches: [master, next]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable && rustup component add clippy
      - run: cargo build --release --locked
      - name: no dependencies but the three crates
        run: test "$(grep '^name = ' Cargo.lock | tr -d '\n')" = 'name = "fux"name = "fux-vt"name = "fuxix"'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: verify the pinned Unicode test file
        run: python3 tools/unicode.py test fux-vt/tests > /dev/null
      - run: cargo test --workspace --locked -- --test-threads 4
        timeout-minutes: 5
      - run: cargo test --release --locked --test panes --test carrier -- --test-threads 4
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
      - run: ./example.sh
        timeout-minutes: 1
      - run: tools/help-agents.sh
        timeout-minutes: 3
      - run: ./sizes.sh
  referee:
    # The same bytes to fux, xterm, tmux and the old emulator: fails on a difference the README's table lacks.
    # The table's rows depend on the witnesses' versions: this image's, until someone moves it on purpose.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xterm xvfb tmux
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - run: cargo build --release --locked --manifest-path tools/referee/old/Cargo.toml
      - run: tools/referee/referee.py
        timeout-minutes: 5
