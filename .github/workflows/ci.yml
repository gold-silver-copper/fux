name: CI

on:
  # A branch with an open pull request is tested once, by the pull_request event.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
          - os: ubuntu-latest
            rust: 1.95.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy -p zor --all-targets --all-features --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy -p zor --all-targets --no-default-features --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy -p zor --no-default-features --features cli --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} clippy -p local-ipc --all-targets --locked -- -D warnings
      - name: Build the exact binaries for real-process scenarios
        run: |
          cargo +${{ matrix.rust }} build --locked -p fux --bin fux
          cargo +${{ matrix.rust }} build --locked -p zor --no-default-features --features cli --bin zor
      # The real zor integration pairs the exact binaries built above and cannot silently skip.
      # Its 21 real-process scenarios run on Linux, as the former companion job did; hosted
      # macOS runners time out their process startups under that load.
      - name: Workspace tests, including the real zor integration
        if: runner.os == 'Linux'
        env:
          FUX_REQUIRE_ZOR_BIN: "1"
          ZOR_BIN: ${{ github.workspace }}/target/debug/zor
        run: cargo +${{ matrix.rust }} test --workspace --locked -- --test-threads=1
      # zor's test suites keep their historical Linux-only execution: several bound
      # subprocess deadlines against wall-clock and race on hosted macOS runners.
      # Hosted macOS runners are several times slower than Linux ones: harness observation
      # deadlines are scaled, and the two scenarios that exceeded the product's own 10 s
      # session-server startup deadline there run on Linux only (the product timeout is not
      # loosened for tests).
      - name: fux tests without the real zor integration
        if: runner.os != 'Linux'
        env:
          FUX_SCENARIO_DEADLINE_SCALE: "3"
        run: cargo +${{ matrix.rust }} test -p fux --locked --lib --bins --test ecs --test agent_boundary --test structure --test protocol_consumers --test fixtures --test micro_timing --test local_cli -- --test-threads=1 --skip a_full_agent_session_runs_headlessly_over_the_control_protocol
      - if: runner.os == 'Linux'
        run: cargo +${{ matrix.rust }} test -p zor --all-features --locked
      - if: runner.os == 'Linux'
        run: cargo +${{ matrix.rust }} test -p zor --no-default-features --locked
      - if: runner.os == 'Linux'
        run: cargo +${{ matrix.rust }} test -p zor --no-default-features --features cli --locked
      - run: cargo +${{ matrix.rust }} test -p local-ipc --locked
      - run: cargo +${{ matrix.rust }} check -p zor --no-default-features --all-targets --locked
      - run: cargo +${{ matrix.rust }} doc --workspace --no-deps --locked
      - run: cargo +${{ matrix.rust }} doc -p zor --no-deps --all-features --locked
      - name: Verify resolved ownership and feature dependency closures
        run: cargo +stable run --locked --manifest-path tools/xtask/Cargo.toml -- verify-boundaries
      - name: Check zor protocol-layer isolation
        run: '! grep -rE "crate::(emit|platform|pty|rules|screen|state)" crates/zor/src/osc.rs'
      - name: Check zor rules and state layering
        run: |
          ! grep -rE 'crate::(pty|platform|emit)' crates/zor/src/rules
          ! grep -rE 'crate::(pty|platform|emit|screen|rules)' crates/zor/src/state.rs
      - name: Check the PTY wrapper is declared only behind the wrap feature
        run: |
          for module in emit pty screen; do
            grep -B1 -E "^pub mod $module;$" crates/zor/src/lib.rs | grep -q '^#\[cfg(feature = "wrap")\]$'
          done
      - run: cargo +${{ matrix.rust }} clippy --manifest-path crates/fux/tests/verify/fixture-child/Cargo.toml --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo +${{ matrix.rust }} test --manifest-path crates/fux/tests/verify/fixture-child/Cargo.toml --locked
      - if: runner.os != 'Linux'
        run: cargo +${{ matrix.rust }} test --manifest-path crates/fux/tests/verify/fixture-child/Cargo.toml --locked -- --skip concurrent_first_clients_elect_exactly_one_server_and_workspace
      - run: cargo +${{ matrix.rust }} clippy --manifest-path crates/zor/tools/xtask/Cargo.toml --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo +${{ matrix.rust }} test --manifest-path crates/zor/tools/xtask/Cargo.toml --locked

  betamax:
    name: Betamax headless terminal rendering
    runs-on: ubuntu-latest
    env:
      FUX_BETAMAX_DIR: ${{ github.workspace }}/target/betamax
      FUX_BETAMAX_FONT: Noto Sans Mono CJK SC
      FUX_REQUIRE_ZOR_BIN: "1"
      ZOR_BIN: ${{ github.workspace }}/target/debug/zor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install native renderer toolchain and fonts
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          python3 -m venv "$RUNNER_TEMP/betamax-tools"
          "$RUNNER_TEMP/betamax-tools/bin/pip" install ziglang==0.15.2
          "$RUNNER_TEMP/betamax-tools/bin/python" -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent)' >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify and build the rendering harness
        run: |
          cargo +stable fmt --manifest-path tools/xtask/Cargo.toml --check
          cargo +stable clippy --manifest-path tools/xtask/Cargo.toml --features betamax --all-targets --locked -- -D warnings
          cargo +stable test --manifest-path tools/xtask/Cargo.toml --features betamax --locked -- --test-threads=1
          cargo +stable build --manifest-path tools/xtask/Cargo.toml --features betamax --target-dir target/rust-harness --locked
          cargo +stable build --locked -p zor --no-default-features --features cli --bin zor
      - name: Run all headless real-process scenarios with rendering enabled
        run: cargo +stable test -p fux --locked --no-fail-fast --test local_cli --test automation_integration -- --test-threads=1
      - name: Index rendered checkpoints
        if: always()
        run: target/rust-harness/debug/fux-xtask betamax-report "$FUX_BETAMAX_DIR"
      - name: Retain PNGs, terminal states and raw VT evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: betamax-terminal-evidence
          path: target/betamax
          if-no-files-found: error

  android-cross-check:
    name: Android aarch64 cross-check (not runtime coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup target add aarch64-linux-android
      - name: Select Android NDK compiler
        run: |
          test -x "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          echo "CC_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo check -p fux --target aarch64-linux-android --locked
      - run: cargo check -p zor --no-default-features --target aarch64-linux-android --locked

  cross-repository:
    name: Pinned koh composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # The koh repository and exact commit come only from tools/xtask/companions.json; the
      # checkout must be that commit with no local changes.
      - name: Check out the pinned companion
        run: cargo run --locked --manifest-path tools/xtask/Cargo.toml -- dependencies apply
      - run: |
          cargo build --locked -p fux --bin fux
          cargo build --locked -p zor --no-default-features --features cli --bin zor
      - name: Verify gateway-only dependency closure
        run: cargo run --locked --manifest-path tools/xtask/Cargo.toml -- verify-boundaries --koh references/koh
      - name: Verify koh gateway against the exact fux and zor binaries
        env:
          FUX_BIN: ${{ github.workspace }}/target/debug/fux
          ZOR_BIN: ${{ github.workspace }}/target/debug/zor
          KOH_REQUIRE_FUX_BIN: "1"
          KOH_REQUIRE_ZOR_BIN: "1"
        run: cargo test --manifest-path references/koh/Cargo.toml --no-default-features --features cli,gateway --test gateway --locked
      - name: Verify gateway reconnect with the exact fux binary
        env:
          FUX_BIN: ${{ github.workspace }}/target/debug/fux
          KOH_REQUIRE_FUX_BIN: "1"
        run: |
          cargo test --manifest-path references/koh/Cargo.toml --no-default-features --features cli,gateway --lib gateway:: --locked

      - name: Verify standalone koh shell and generic admission
        run: cargo test --manifest-path references/koh/Cargo.toml --locked --test pty --test admission --test e2e_loopback
      # Multi-machine supervision composes the exact fux/zor binaries above with the clean
      # published koh executable: Local plus two isolated remote stacks under a controlling
      # PTY, exact attachment/return, unauthorized and unreachable hosts, plus guarded remote
      # resume with a deliberately lost reply. Every binary is explicit; nothing may skip.
      # Release profile: koh decrypts its argon2id identity key (64 MiB, 4 passes) before it
      # announces the helper socket. Unoptimized, that alone takes several seconds per helper on a
      # hosted runner, and the scenario starts four helpers at once, so debug koh never fits zor's
      # per-request startup budget.
      - name: Build the published koh executable and the real-process harness
        run: |
          cargo build --release --manifest-path references/koh/Cargo.toml --no-default-features --features cli,gateway --locked
          cargo build --locked --manifest-path tools/xtask/Cargo.toml --target-dir target/rust-harness
          test -x references/koh/target/release/koh
      # These scenarios run reliably against the clean published koh pin. The
      # deliberately-lost-reply composition (zor-remote-resume-lost-reply) is retained
      # development-koh evidence: its test-only reply gate is timing-sensitive on the
      # published transport, so it is not part of the always-green gate.
      - name: Multi-machine supervision through the published koh pin
        run: |
          target/rust-harness/debug/fux-xtask scenario zor-multi-machine target/debug/fux target/debug/zor references/koh/target/release/koh
          target/rust-harness/debug/fux-xtask scenario zor-remote-resume target/debug/fux target/debug/zor references/koh/target/release/koh
          target/rust-harness/debug/fux-xtask scenario zor-remote-resume-dashboard target/debug/fux target/debug/zor references/koh/target/release/koh
      - name: Recheck companion provenance after testing
        run: cargo run --locked --manifest-path tools/xtask/Cargo.toml -- dependencies verify

  package:
    name: Standalone package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # fux and zor depend on the unpublished local-ipc crate: packaging them together lets cargo
      # verify each against the freshly packaged dependency instead of the registry.
      - run: cargo package --locked -p fux -p local-ipc
      - run: cargo package --locked -p zor -p local-ipc
      - run: cargo package --locked -p local-ipc
