name: CI

on:
  push:
    branches: [ecs-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
          - os: macos-latest
            rust: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install "${{ matrix.rust }}" --profile minimal --component rustfmt,clippy
      - run: cargo +${{ matrix.rust }} fmt --all --check
      - run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +${{ matrix.rust }} build --locked --workspace --bins
      - run: cargo +${{ matrix.rust }} test --workspace --locked -- --test-threads=1
      - run: cargo +${{ matrix.rust }} doc --workspace --no-deps --locked
      - run: cargo +${{ matrix.rust }} package --workspace --locked --allow-dirty --no-verify
      - name: Dependency report (prompt section 2)
        run: cargo +${{ matrix.rust }} run --locked --manifest-path tools/xtask/Cargo.toml -- deps
      - name: Tooling format and lint
        run: |
          cargo +${{ matrix.rust }} fmt --manifest-path tools/xtask/Cargo.toml --check
          cargo +${{ matrix.rust }} clippy --locked --manifest-path tools/xtask/Cargo.toml --all-targets -- -D warnings
      - name: Composed terminal and recovery scenarios
        env:
          FUX_SCENARIO_ARTIFACTS: ${{ runner.temp }}/fux-zor-scenarios
        run: cargo +${{ matrix.rust }} run --locked --manifest-path tools/xtask/Cargo.toml -- scenarios
      - name: Isolated source installation
        run: |
          cargo +${{ matrix.rust }} install --locked --path crates/fux --root "$RUNNER_TEMP/fux-alpha" --target-dir target --force
          cargo +${{ matrix.rust }} install --locked --path crates/zor --root "$RUNNER_TEMP/fux-alpha" --target-dir target --force
          "$RUNNER_TEMP/fux-alpha/bin/fux" --version
          "$RUNNER_TEMP/fux-alpha/bin/zor" --version
          cargo +${{ matrix.rust }} uninstall --root "$RUNNER_TEMP/fux-alpha" fux zor
