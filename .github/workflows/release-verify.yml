name: Release artifact verification

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  packaged-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/koh
          path: references/koh
          ref: cfb6f3e5b623b8656171278be2a5a235928142d7
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gold-silver-copper/zor
          path: zor
          ref: v0.1.2
      - run: tests/verify/release-package.sh
