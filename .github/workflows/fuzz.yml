name: Fuzz

# Nightly and on request: fux's targets replay their corpora, and each of
# fux-vt's targets and the oracle explore for five minutes from their
# corpus, their frozen seeds and what earlier nights found, which is kept
# in the Actions cache between nights. `cargo test` runs none of them, and
# a fuzz run is too long for every push. Each target is a job of its own,
# so one that fails or doesn't build names itself and the others still run.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    name: fux's targets, replayed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: fux's targets, over their corpora
        env:
          # session frees millions of small allocations (fuzz/README.md).
          ASAN_OPTIONS: quarantine_size_mb=16
        run: |
          set -euo pipefail
          failed=()
          for target in protocol paint layout config session fuxth_tokens fuxth_run fuxth_pause; do
            cargo +nightly fuzz run "$target" --fuzz-dir fuzz "fuzz/corpus/$target" -- -runs=0 -rss_limit_mb=2048 -timeout=25 \
              || failed+=("$target")
          done
          if ((${#failed[@]})); then
            echo "::error::failed: ${failed[*]}"
            exit 1
          fi

  explore:
    name: ${{ matrix.target }}, explored
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: terminal, dir: fux-vt/fuzz, options: "-max_len=4096 -dict=fux-vt/fuzz/terminal.dict -use_value_profile=1" }
          - { target: deep, dir: fux-vt/fuzz, options: "-max_len=65536 -dict=fux-vt/fuzz/terminal.dict -timeout=60" }
          - { target: keys, dir: fux-vt/fuzz, options: "" }
          - { target: graphemes, dir: fux-vt/fuzz, options: "-use_value_profile=1" }
          - { target: cells, dir: fux-vt/fuzz, options: "-use_value_profile=1" }
          - { target: oracle, dir: diff/fuzz, options: "-dict=fux-vt/fuzz/terminal.dict" }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      DIR: ${{ matrix.dir }}
      OPTIONS: ${{ matrix.options }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Nightly and cargo-fuzz
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2

      # The oracle builds against fux-vt's base-vt pin, which must name this
      # very commit for both sides to share one API (diff/README.md).
      - name: The oracle's pin
        if: matrix.target == 'oracle'
        run: diff/oracle.sh --pin HEAD

      - name: Build
        run: cargo +nightly fuzz build "$TARGET" --fuzz-dir "$DIR"

      # What earlier nights found, newest first; saved again only when the
      # run passes, so a night that crashes keeps the last good corpus.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Explore for five minutes
        run: |
          set -euo pipefail
          found="fuzz-corpus/$TARGET"
          mkdir -p "$found"
          from=()
          for dir in "$DIR/corpus/$TARGET" "$DIR/seeds/$TARGET"; do
            [[ -d "$dir" ]] && from+=("$dir")
          done
          echo "corpus: $(ls "$found" | wc -l) found before, from ${from[*]:-nothing stored}"
          # shellcheck disable=SC2086
          cargo +nightly fuzz run "$TARGET" --fuzz-dir "$DIR" "$found" "${from[@]}" -- \
            -max_total_time=300 -rss_limit_mb=2048 -timeout=25 -print_final_stats=1 $OPTIONS
          echo "corpus: $(ls "$found" | wc -l) after"
