name: Nightly verification

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-scenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: cargo build --locked --bin fux
      - name: Repeat deterministic ECS, structural and real-process checks
        run: |
          for pass in 1 2 3; do
            cargo test --test ecs --test structure --test local_cli --locked -- --test-threads=1
            cargo test --manifest-path tests/verify/fixture-child/Cargo.toml --locked
          done
      - name: Extended randomized command sequences
        env:
          PROPTEST_CASES: 2048
        run: cargo test --test ecs --locked
