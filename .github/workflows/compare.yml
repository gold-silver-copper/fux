name: fux-vt beside other terminals

# fux-vt/compare on Linux, on request: it builds Ghostty with Zig,
# wezterm-term from git and libvterm, and drives xterm.js, tmux and xterm,
# too much for every push. run.sh checks Zig and libvterm by SHA-256.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: tmux, Xvfb and what xterm builds with
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q tmux xvfb libxaw7-dev libxft-dev libncurses-dev pkg-config

      # xterm 411, the patch the README names as the authority, checked by
      # the SHA-256 of the tarball Thomas E. Dickey signed. Ubuntu's (390)
      # predates printRawChars (patch 397): its print hides a wide
      # character's second half, and the harness refuses it.
      - name: xterm 411
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o xterm.tgz https://invisible-island.net/archives/xterm/xterm-411.tgz
          echo "969be283670deadd66934865c4de6c5ab045e3a3facc2b228decf91a20d8c36c  xterm.tgz" | sha256sum -c -
          tar -xzf xterm.tgz
          cd xterm-411
          ./configure -q --disable-setuid --without-utempter --with-app-defaults=/usr/share/X11/app-defaults
          make -s -j4
          sudo make -s install
          [[ $(xterm -version) == "XTerm(411)" ]]

      # The generated tables are what fux-vt-gen writes from the pinned
      # Unicode files, checked by their SHA-256s (references/unicode.sha256,
      # which references/fetch.sh checks its downloads against too).
      - name: The generated Unicode tables
        run: |
          set -euo pipefail
          u=https://www.unicode.org/Public/17.0.0
          while read -r sum path; do
            [[ $sum == "#"* || -z $sum ]] && continue
            mkdir -p "references/unicode/$(dirname "$path")"
            curl -sSfL --retry 2 -o "references/unicode/$path" "$u/$path"
            echo "$sum  references/unicode/$path" | sha256sum -c --quiet -
          done <references/unicode.sha256
          cargo run --locked --quiet --manifest-path fux-vt/gen/Cargo.toml -- references/unicode
          git diff --exit-code -- fux-vt/src/unicode/tables.rs fux-vt/tests/data

      - name: The named cases, beside every engine
        run: fux-vt/compare/run.sh cases

      - name: The families expected to agree, beside the voting panel
        run: fux-vt/compare/run.sh --cases 20000

      - name: The families with a recorded verdict, beside xterm
        run: fux-vt/compare/run.sh verdicts

      - name: The input encoders, beside libghostty-vt's
        run: fux-vt/compare/run.sh encoders
