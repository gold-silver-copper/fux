[package]
name = "fux-fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Opt-in black-box scenarios for an already-built fux"

[dependencies]
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
nix = { version = "0.30", features = ["fs", "signal", "process", "term"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exact: the shared Unix connector (../src/unix_http.rs) implements ureq's
# `unversioned` transport API, which is outside ureq's semver promise.
ureq = { version = "=3.4.2", default-features = false, features = ["json"] }
signal-hook = "0.3"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "warn"
