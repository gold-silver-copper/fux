[package]
name = "fuxix"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "The system calls fux makes on Linux, Android and macOS, over libc, each safe to call; on Windows, its event loop over one I/O completion port and its named pipes"
repository = "https://github.com/gold-silver-copper/fux"
readme = "README.md"
keywords = ["pty", "termios", "syscall", "unix", "fux"]
categories = ["os::unix-apis"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }

# Windows only, and run by CI's ConPTY step by name: they need the
# pinned package (FUXIX_CONPTY_PACKAGE), or else the network.
[[test]]
name = "conpty"
harness = false
test = false

[[test]]
name = "conpty_fallback"
test = false

[lints.rust]
unused_must_use = "forbid"
unconditional_recursion = "forbid"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
suspicious = { level = "forbid", priority = -1 }
print_stdout = "forbid"
print_stderr = "forbid"
dbg_macro = "forbid"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unreachable = "forbid"
todo = "forbid"
unimplemented = "forbid"
indexing_slicing = "forbid"
exit = "forbid"
infinite_loop = "forbid"
large_stack_frames = "forbid"
unchecked_time_subtraction = "forbid"
read_zero_byte_vec = "forbid"
unused_result_ok = "forbid"
debug_assert_with_mut_call = "forbid"
allow_attributes = "forbid"
undocumented_unsafe_blocks = "forbid"
multiple_unsafe_ops_per_block = "forbid"
significant_drop_in_scrutinee = "forbid"
significant_drop_tightening = "forbid"
cast_lossless = "forbid"
string_slice = "forbid"
mem_forget = "forbid"
large_stack_arrays = "forbid"
allow_attributes_without_reason = "forbid"
wildcard_enum_match_arm = "forbid"
cast_possible_truncation = "forbid"
cast_possible_wrap = "forbid"
cast_sign_loss = "forbid"
arithmetic_side_effects = "forbid"
disallowed_methods = "forbid"
