[package]
name = "fux2"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A terminal multiplexer with no server: each pane is its own small process"
repository = "https://github.com/gold-silver-copper/fux"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "fux2"
path = "src/main.rs"

[dependencies]
fux-vt = { path = "../fux-vt", version = "0.17.0" }
fuxix = { path = "../fuxix", version = "0.10.0" }

[lints]
workspace = true
