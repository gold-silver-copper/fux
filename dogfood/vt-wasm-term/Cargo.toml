[package]
name = "vt-wasm-term"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fux-vt = { path = "../../fux-vt" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[lints.clippy]
