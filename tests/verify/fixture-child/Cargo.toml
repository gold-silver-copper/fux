[package]
name = "fux-fixture-child"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
rustix = { version = "1", features = ["fs", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
fux = { path = "../../.." }
koh = { version = "=0.12.1", path = "../../../references/koh", default-features = false, features = ["backend-termina"] }
nix = { version = "0.30", features = ["signal"] }
portable-pty = "=0.9.0"
vt100 = "0.16"

[lints.rust]
unsafe_code = "forbid"
