[workspace]

[package]
name = "fux-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fux = { path = ".." }
fux-vt = { path = "../fux-vt" }

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keys"
path = "fuzz_targets/keys.rs"
test = false
doc = false
bench = false

[[bin]]
name = "paint"
path = "fuzz_targets/paint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session"
path = "fuzz_targets/session.rs"
test = false
doc = false
bench = false
